name: release-launcher
# Publish the launcher and its SHA-256 checksum as Release assets for every v*
# tag, so the documented install command can fetch a pinned version and verify
# it before running it. The published launcher defaults to the image of the
# same release. The assets are built from the tagged commit, never main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Stamp the release image and write checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release
          cp bin/dmf-init release/dmf-init
          # Pin the default image to this release before hashing, so the
          # checksum covers the stamped file. Fails if the marker is not
          # found exactly once.
          scripts/stamp-launcher-image.sh release/dmf-init "$TAG"
          grep -n '^DEFAULT_IMAGE=' release/dmf-init
          # Run inside the directory so the file name in SHA256SUMS is plain
          # "dmf-init" and `sha256sum -c` works wherever the user downloads it.
          (cd release && sha256sum dmf-init > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Attach to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            release/dmf-init
            release/SHA256SUMS
