name: automerge
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
jobs:
  automerge:
    # Metadata-only — no checkout, never executes PR code, and under
    # pull_request_target the BASE branch's workflow definition runs, so a PR
    # cannot alter this job to its own advantage. It only arms GitHub-native
    # rebase auto-merge: the actual merge happens when (and only when) the
    # branch ruleset is satisfied — CODEOWNERS approval + every required
    # status check green. Working-model mechanism: dmfdeploy/dmfdeploy#34.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Arm rebase auto-merge (hold label disarms)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -eu
          # Decide from the PR's labels and draft state as they are now, not
          # from the event payload, which is a snapshot: `gh pr create --label`
          # fires `opened` without the label, and a late `opened` run would
          # arm a held PR (#439). If the read fails, exit non-zero without
          # touching auto-merge, so a failed read never arms. The same holds
          # for a reply that is not a boolean isDraft and named labels.
          pr=$(gh pr view "${PR_URL}" --json labels,isDraft)
          jq -e '(.isDraft | type == "boolean") and (.labels | type == "array")
            and all(.labels[]; (.name | type) == "string")' <<<"${pr}" >/dev/null
          labels=$(jq -r '[.labels[].name] | join(" ")' <<<"${pr}")
          draft=$(jq -r '.isDraft' <<<"${pr}")
          case " ${labels} " in *" hold "*)
            gh pr merge --disable-auto "${PR_URL}" || true
            echo "hold label present — auto-merge disarmed"
            exit 0 ;;
          esac
          if [ "${draft}" = "true" ]; then
            echo "draft PR — skipping"
            exit 0
          fi
          gh pr merge --auto --rebase "${PR_URL}"
          echo "auto-merge (rebase) armed — merges when approval + required checks are satisfied"
