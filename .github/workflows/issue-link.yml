name: issue-link
on:
  pull_request:
    branches: [main]
    # Adding or removing a label, such as no-issue, re-runs this check, as does
    # editing the description. It lives apart from guard.yml so those events
    # don't also restart the secret and vulnerability scans.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions: {}
concurrency:
  group: issue-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  issue-link:
    # Working-model gate (umbrella issue dmfdeploy/dmfdeploy#32): every PR must
    # reference its tracking issue in the canonical backlog FULLY QUALIFIED —
    # bare #N resolves to this repo's own issues and silently misses. Trivial
    # changes: add the no-issue label.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: PR references a canonical-backlog issue (qualified)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # Read the body and labels now, not from the event payload. Dependabot
          # opens a PR and labels it at once; the payload of the run that
          # survives the concurrency group can predate the label.
          PR_BODY="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          PR_LABELS="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '[.labels[].name] | join(" ")')"
          # A link to a private agent session does not belong in a public PR (#838).
          # This runs before the no-issue exit, so the label cannot skip it. The match
          # is case-insensitive because hostnames are; it targets accidental links,
          # not deliberate obfuscation.
          if printf '%s' "${PR_BODY}" | grep -qiE 'claude\.ai/code/session'; then
            echo "FAIL: PR description links to an agent session; remove the link." >&2
            exit 1
          fi
          case " ${PR_LABELS} " in *" no-issue "*)
            echo "OK: no-issue label set"; exit 0 ;;
          esac
          if printf '%s' "${PR_BODY}" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]:]+(dmfdeploy/dmfdeploy#[0-9]+|https://github\.com/dmfdeploy/dmfdeploy/issues/[0-9]+)'; then
            echo "OK: qualified issue reference found"
            exit 0
          fi
          echo "FAIL: PR body must reference its tracking issue FULLY QUALIFIED, e.g. 'Refs dmfdeploy/dmfdeploy#32'." >&2
          echo "Bare #N points at THIS repo, not the canonical backlog — see umbrella docs/WORKING-MODEL.md." >&2
          echo "Trivial change? Add the 'no-issue' label." >&2
          exit 1
