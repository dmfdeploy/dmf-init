name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python3 -m pip install -r requirements-ci.txt
          pip install .[dev]
      - run: |
          ruff check .
      - name: Install age (backup/restore tests invoke age-keygen)
        run: sudo apt-get update && sudo apt-get install -y age
      - run: |
          pytest
      # Manage passes its own argv to dmf-env scripts. Run that argv against
      # the current dmf-env, so a renamed flag or a new prompt fails here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: dmfdeploy/dmf-env
          path: dmf-env
          persist-credentials: false
      - name: Manage argv against the real dmf-env scripts
        env:
          DMF_TEST_DMF_ENV_REPO: ${{ github.workspace }}/dmf-env
        # A skip would pass silently, so the step requires one passed test.
        run: |
          set -o pipefail
          pytest -rs tests/test_manage_actions.py -k upgrade_in_place_script | tee "$RUNNER_TEMP/real-script.txt"
          grep -q " 1 passed" "$RUNNER_TEMP/real-script.txt"
      # The two round-trip tests render an env with the real init-wizard, back
      # it up and restore it. Without the variable they skip.
      - name: Install sops (the init-wizard encrypts the env bundle with it)
        env:
          SOPS_VERSION: "3.10.2"
          # From sops-v3.10.2.checksums.txt on the same release.
          SOPS_SHA256: "79b0f844237bd4b0446e4dc884dbc1765fc7dedc3968f743d5949c6f2e701739"
        run: |
          set -eu
          curl -fsSLo /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - name: Create, back up and restore against the real dmf-env
        env:
          DMF_TEST_DMF_ENV_REPO: ${{ github.workspace }}/dmf-env
        # A skip exits with success, so the last line of the quiet summary must
        # say exactly "2 passed", with nothing skipped, failed or deselected.
        run: |
          set -o pipefail
          pytest -q -rs \
            tests/test_createnew_e2e.py::test_create_new_hermetic_round_trip \
            tests/test_bootstrap_steps.py::test_checkpoint_backup_round_trip_records_manifest_and_restores_openbao_keys \
            | tee "$RUNNER_TEMP/round-trip.txt"
          tail -n 1 "$RUNNER_TEMP/round-trip.txt" | grep -Eq '^2 passed( in |, [0-9]+ warnings? in )'
      # dmf-infra's token revoker parses the audit record that dmf-init writes,
      # using fixtures kept in dmf-infra. Run the test against them, so a change
      # to the record format fails here instead of skipping.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: dmfdeploy/dmf-infra
          path: dmf-infra
          persist-credentials: false
      - name: Revoker record fixtures against dmf-infra
        env:
          DMF_TEST_DMF_INFRA_REPO: ${{ github.workspace }}/dmf-infra
        # A skip exits with success, so the last line of the quiet summary must
        # say exactly "2 passed", with nothing skipped, failed or deselected.
        run: |
          set -o pipefail
          pytest -q -rs tests/test_audit_revoker_fixture.py | tee "$RUNNER_TEMP/revoker-fixture.txt"
          tail -n 1 "$RUNNER_TEMP/revoker-fixture.txt" | grep -Eq '^2 passed( in |, [0-9]+ warnings? in )'

  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install command fails closed on a bad checksum
        env:
          REQUIRE_HTTP_FIXTURE: "1"
        run: test/launcher/test-install-command.sh
      - name: Release stamp pins the launcher image
        run: test/launcher/test-stamp-launcher-image.sh
      - name: Release assets are built in the right order
        run: test/launcher/test-build-launcher-release.sh

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
      - run: |
          cd frontend && npm run build

  docker-build-smoke:
    runs-on: ubuntu-24.04-arm
    needs: [python, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: |
          docker build -t dmf-init:ci .

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — umbrella: canonical template + checker
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
