name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python3 -m pip install --upgrade pip
          pip install .[dev]
      - run: |
          ruff check .
      - name: Install age (backup/restore tests invoke age-keygen)
        run: sudo apt-get update && sudo apt-get install -y age rclone
      - run: |
          pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
      - run: |
          cd frontend && npm run build

  docker-build-smoke:
    runs-on: ubuntu-24.04-arm
    needs: [python, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: |
          docker build -t dmf-init:ci .

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — umbrella: canonical template + checker
        with:
          repository: dmfdeploy/dmfdeploy
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
