---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # A new Python minor version is a language upgrade done on purpose, tracked
    # in dmfdeploy/dmfdeploy#982. Major upgrades are done on purpose, as their
    # own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
