---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # ansible-core arrives as its own PR because the pin moves only after a live install (dmfdeploy/dmfdeploy#995).
        exclude-patterns:
          - "ansible-core"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # A new Python minor version is a language upgrade done on purpose, tracked
    # in dmfdeploy/dmfdeploy#982.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
