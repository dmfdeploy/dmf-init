name: build-bundle
# Build the self-contained dmf-init appliance bundle on the self-hosted
# dmf-builder runner (Lima VM with dockerd). Clones the 6 runtime repos fresh
# from this Forgejo/GitHub instance at the chosen ref and bakes them into the
# image. The instance URL comes from ${{ github.server_url }} — no hardcoded
# host — so this same workflow runs unchanged on the future GitHub setup.
#
# Trigger: manual (workflow_dispatch) or a v* tag push. Release-asset upload is
# a follow-up once the build path is proven.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "repo ref to bake (branch or tag)"
        default: main
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: dmf-builder
    steps:
      - name: Build appliance bundle
        env:
          DMF_REPO_TOKEN: ${{ secrets.DMF_REPO_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-main}"
          base="${SERVER_URL}/${OWNER}"
          # inject the read token after the scheme for private clones
          auth_server="$(printf '%s' "${SERVER_URL}" | sed -E "s#^(https?://)#\1oauth2:${DMF_REPO_TOKEN}@#")"
          work="$(mktemp -d)"
          echo "==> cloning dmf-init @ ${ref} from ${SERVER_URL}"
          git clone --quiet --depth 1 --branch "${ref}" \
            "${auth_server}/${OWNER}/dmf-init.git" "${work}/dmf-init"
          cd "${work}/dmf-init"
          echo "==> building bundle (runtime repos baked fresh @ ${ref})"
          bin/build-bundle.sh -o "${work}" --ref "${ref}" --repo-base-url "${base}"
          echo "==> artifact"
          ls -lh "${work}"/dmf-init-bundle-*.tar.gz
          docker run --rm --entrypoint cat dmf-init:bundle \
            /tmp/dmf-init-data/provenance/build.json || true
